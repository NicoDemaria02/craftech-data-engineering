version: 2

models:
  - name: silver_customers
    description: Clientes. 1 fila por cliente.
    columns:
      - name: customer_id
        description: Identificador del cliente (C + 5 dígitos).
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [retail, wholesale]
      - name: created_at
        data_tests: [not_null]

  - name: silver_products
    description: Catálogo de productos con precio de lista actual. 1 fila por producto.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [beauty, books, electronics, home, sports]
      - name: unit_price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: [USD]

  - name: silver_orders
    description: >
      Eventos del ciclo de vida de cada orden, deduplicados.
      1 fila por (order_id, status, event_at).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, status, event_at]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, paid, shipped, delivered, cancelled, returned]
      - name: event_at
        data_tests: [not_null]

  - name: silver_order_items
    description: Líneas de cada orden, deduplicadas. 1 fila por (order_id, line_number).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, line_number]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_products')
                field: product_id
      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
